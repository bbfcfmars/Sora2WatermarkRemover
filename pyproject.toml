[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sora2-watermark-remover"
version = "1.0.0"
description = "Remove watermarks from Sora 2 generated videos and images using AI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "numpy>=1.24",
    "tqdm>=4.60",
    "loguru>=0.6",
    "Pillow>=9.0",
    "opencv-python-headless>=4.7",
    "transformers>=4.30",
    "iopaint>=1.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "psutil>=5.9",
    "PyYAML>=6.0",
    "PyQt6>=6.4",
    "matplotlib>=3.7",
]

[project.scripts]
sora-remwm = "remwm:main"
sora-remwm-gui = "remwmgui:main"

[tool.setuptools]
py-modules = ["remwm", "remwmgui", "utils", "download_lama"]
