[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "sora2-watermark-remover"
version = "1.0.0"
description = "Remove watermarks from Sora 2 generated videos and images using AI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "click",
    "numpy",
    "tqdm",
    "loguru",
    "Pillow",
    "opencv-python-headless",
    "transformers",
    "iopaint",
    "torch",
    "torchvision",
    "psutil",
    "PyYAML",
    "PyQt6",
    "matplotlib",
]

[project.scripts]
sora-remwm = "remwm:main"
sora-remwm-gui = "remwmgui:main"

[tool.setuptools]
py-modules = ["remwm", "remwmgui", "utils", "download_lama"]
